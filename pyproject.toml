[project]
name = "sensorix"
version = "1.0.0"
description = "Hardware monitor for Arch Linux in the style of CPUID HWMonitor (PySide6)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sensorix = "sensorix.main:main"

[project.gui-scripts]
sensorix-gui = "sensorix.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sensorix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
