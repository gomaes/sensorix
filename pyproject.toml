[project]
name = "hwmonitor-linux"
version = "1.0.0"
description = "CPUID HWMonitor 風のハードウェアモニター for Arch Linux (PySide6)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
hwmonitor = "hwmonitor.main:main"

[project.gui-scripts]
hwmonitor-gui = "hwmonitor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hwmonitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
